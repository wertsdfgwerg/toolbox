<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI小工具箱 | AI Toolbox</title>

<style>

body{
font-family:Arial,"Microsoft YaHei";
max-width:900px;
margin:auto;
padding:30px;
background:#f5f7fa;
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#666;
}

.card{

background:white;
padding:25px;
margin:20px 0;
border-radius:15px;
box-shadow:0 5px 15px #ddd;

}


textarea{

width:100%;
height:120px;
padding:10px;
font-size:16px;

}


button{

background:#222;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;

}


.result{

margin-top:20px;
background:#eee;
padding:15px;
white-space:pre-wrap;

}


.tool{

display:inline-block;
background:#f0f0f0;
padding:10px;
margin:5px;
border-radius:8px;

}


footer{

text-align:center;
color:#888;
margin-top:40px;

}

</style>

</head>


<body>


<h1>
🤖 AI小工具箱
</h1>


<p class="subtitle">

免费 AI 效率工具集合<br>

Free AI Productivity Tools

</p>



<div class="card">


<h2>
🔥 AI提示词生成器
</h2>


<p>
告诉我你想做什么，生成专业AI提示词
</p>


<textarea id="input"
placeholder="例如：帮我写小红书减肥文案">
</textarea>


<br><br>


<button onclick="generate()">

生成提示词

</button>


<div class="result" id="output">

等待生成...

</div>


</div>



<div class="card">


<h2>
📄 AI简历助手
</h2>


<p>

输入你的经历，生成简历优化提示词

</p>


<textarea id="resume"

placeholder="例如：大学毕业，会Python，有项目经验">

</textarea>


<br><br>


<button onclick="resumeAI()">

生成简历提示词

</button>


<div class="result" id="resumeout">

等待生成...

</div>


</div>




<div class="card">


<h2>
🌍 English AI Tools
</h2>


<div class="tool">
AI Prompt Generator
</div>


<div class="tool">
AI Resume Helper
</div>


<div class="tool">
AI Writing Assistant
</div>


</div>




<div class="card">


<h2>
未来计划

</h2>

<p>

✅ AI聊天助手<br>
✅ AI图片工具<br>
✅ AI文案工具<br>
✅ 更多自动化工具

</p>


</div>



<footer>

© 2026 AI Toolbox

</footer>




<script>


function generate(){


let text=document.getElementById("input").value;


document.getElementById("output").innerHTML=

`
你是一名专业AI助手。

请完成以下任务：

${text}

要求：

1. 给出详细步骤
2. 输出高质量结果
3. 优化表达方式
4. 提供多个方案

`;

}



function resumeAI(){


let text=document.getElementById("resume").value;


document.getElementById("resumeout").innerHTML=

`

你是一名专业简历顾问。

请根据以下经历：

${text}


生成：

1. 简历项目描述
2. 技能总结
3. 自我介绍
4. 面试回答建议


`;

}



</script>


</body>

</html>
